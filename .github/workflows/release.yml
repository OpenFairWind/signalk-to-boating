name: Release

# Publishes to npm when a version tag (vX.Y.Z) is pushed.
#
# Uses npm trusted publishing (OIDC): no npm token is stored in the repository.
# Before the first automated release a maintainer of the `uniparthenope` npm
# account must add this repository and workflow file (release.yml) as a
# trusted publisher on https://www.npmjs.com/package/signalk-to-boating/access
# and create a GitHub environment named "npm".

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (for example v1.1.0)'
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
      - run: npm run coverage
      - run: npm audit --omit=dev
      - run: npm run verify:package

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: verify
    environment: npm
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@^11.5.1
      - name: Publish
        run: npm publish --provenance --access public --ignore-scripts
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${RELEASE_TAG#v}"
          awk -v v="$version" '$0 == "## " v {f=1; next} /^## / && f {exit} f' CHANGELOG.md > release-notes.md
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "$RELEASE_TAG" --notes-file release-notes.md --verify-tag
